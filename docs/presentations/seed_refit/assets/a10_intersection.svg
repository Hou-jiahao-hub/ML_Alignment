<text x="800.0" y="780.82" font-family="Droid Sans Fallback, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#23343D">求交有效性 ≠ 传感器有限边界检查；无效分量通过 mask 排除</text></svg>